<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Chat Rooms</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js"></script>
    <style>
        :root {
            --primary: #007bff;
            --primary-hover: #0056b3;
            --bg-color: #f4f7f6;
            --panel-bg: #ffffff;
            --border-color: #e1e4e8;
            --text-main: #333333;
            --text-muted: #666666;
            --msg-bg-other: #e9ecef;
            --msg-bg-own: #d1e7dd;
            --danger: #dc3545;
            --danger-hover: #c82333;
            --radius: 8px;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        body.dark-mode {
            --primary: #3b82f6;
            --primary-hover: #60a5fa;
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --border-color: #333333;
            --text-main: #e0e0e0;
            --text-muted: #9ca3af;
            --msg-bg-other: #2d2d2d;
            --msg-bg-own: #164e63;
            --danger: #ef4444;
            --danger-hover: #f87171;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            height: 100dvh;
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            display: flex;
            width: 100%;
            max-width: 1200px;
            height: 100%;
            background: var(--panel-bg);
            box-shadow: var(--shadow);
            overflow: hidden;
            transition: background-color 0.3s;
        }

        /* Left Panel */
        #left-panel {
            width: 250px;
            background: var(--bg-color);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        #left-panel h3 {
            margin-top: 0;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        #room-directory {
            flex: 1;
            overflow-y: auto;
        }

        #room-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .room-item {
            cursor: pointer;
            padding: 10px 12px;
            border-radius: var(--radius);
            margin-bottom: 8px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            transition: all 0.2s;
            font-weight: 500;
            color: var(--primary);
            display: flex;
            align-items: center;
        }

        .room-item:hover {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        /* Right Panel */
        #right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            background: var(--panel-bg);
            overflow: hidden;
            min-height: 0;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        h2, h3, h4 {
            margin: 0;
            font-weight: 600;
        }

        /* Forms */
        input[type="text"], input[type="password"], input[type="number"] {
            width: 100%;
            padding: 10px 12px;
            background: var(--panel-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            margin-bottom: 12px;
            font-family: inherit;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
        }

        button {
            width: 100%;
            padding: 10px 15px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--primary-hover);
        }

        button.danger {
            background: var(--danger);
        }

        button.danger:hover {
            background: var(--danger-hover);
        }

        .icon-btn {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            width: auto;
            border-radius: var(--radius);
            font-size: 1rem;
        }

        .icon-btn:hover {
            background: var(--bg-color);
        }

        /* Setup Section */
        #setup {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-content: flex-start;
            overflow-y: auto;
        }

        .setup-card {
            flex: 1;
            min-width: 250px;
            background: var(--panel-bg);
            padding: 20px;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }

        .setup-card h3 {
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .form-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .form-row label {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Chat Section */
        #chat {
            display: none;
            flex-direction: column;
            width: 100%;
            height: 100%;
            min-height: 0; 
            flex: 1;
        }

        .chat-container {
            display: flex;
            gap: 20px;
            flex: 1;
            overflow: hidden;
            min-height: 0;
        }

        .chat-main {
            flex: 3;
            display: flex;
            flex-direction: column;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            overflow: hidden;
            min-height: 0;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 0;
        }

        /* Message Bubbles */
        .msg-container {
            display: flex;
            flex-direction: column;
            max-width: 75%;
        }

        .msg-own {
            align-self: flex-end;
            align-items: flex-end;
        }

        .msg-other {
            align-self: flex-start;
            align-items: flex-start;
        }

        .msg-bubble {
            padding: 10px 14px;
            border-radius: 12px;
            background: var(--msg-bg-other);
            color: var(--text-main);
            position: relative;
            word-wrap: break-word;
            line-height: 1.4;
        }

        .msg-own .msg-bubble {
            background: var(--msg-bg-own);
            border-bottom-right-radius: 4px;
        }

        .msg-other .msg-bubble {
            border-bottom-left-radius: 4px;
        }

        .msg-header {
            font-size: 0.8rem;
            margin-bottom: 4px;
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .msg-name {
            font-weight: 600;
        }

        .msg-time {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .system-msg {
            align-self: center;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-style: italic;
            background: rgba(0,0,0,0.05);
            padding: 4px 12px;
            border-radius: 20px;
            margin: 5px 0;
        }

        body.dark-mode .system-msg {
            background: rgba(255,255,255,0.05);
        }

        .chat-image {
            max-width: 100%;
            max-height: 250px;
            border-radius: 8px;
            margin-top: 5px;
        }

        /* Input Area */
        .input-area {
            padding: 15px;
            background: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0; /* Prevents squishing */
        }

        #typing_indicator {
            color: var(--text-muted);
            font-style: italic;
            font-size: 0.8rem;
            height: 16px;
            margin-bottom: 8px;
            padding-left: 5px;
        }

        .input-row {
            display: flex;
            gap: 10px;
            align-items: center;
            position: relative;
        }

        .input-row input[type="text"] {
            margin-bottom: 0;
            flex: 1;
        }

        .file-upload {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }
        .file-upload input[type="file"] {
            position: absolute;
            font-size: 100px;
            opacity: 0;
            right: 0;
            top: 0;
            cursor: pointer;
        }
        .file-upload-btn, .emoji-btn {
            background: var(--msg-bg-other);
            color: var(--text-main);
            padding: 10px 15px;
            border-radius: var(--radius);
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s;
        }
        .file-upload-btn:hover, .emoji-btn:hover {
            background: var(--bg-color);
        }

        .input-row button {
            width: auto;
            padding: 10px 20px;
        }

        /* Roster */
        .roster-sidebar {
            flex: 1;
            min-width: 150px;
            max-width: 200px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            background: var(--panel-bg);
            padding: 15px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .roster-sidebar h4 {
            margin-top: 0;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        #roster {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #roster li {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            #left-panel {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                max-height: 200px;
                padding: 15px;
                flex-shrink: 0;
            }
            #right-panel {
                padding: 15px;
                flex: 1;
                min-height: 0;
            }
            .chat-container {
                flex-direction: column;
            }
            .roster-sidebar {
                max-width: none;
                max-height: 120px;
                order: -1;
                flex-shrink: 0;
            }
            #setup {
                flex-direction: column;
                display: block;
            }
            .input-row {
                flex-wrap: wrap;
            }
            .emoji-btn, .file-upload-btn {
                padding: 10px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Left Panel: Directory -->
        <div id="left-panel">
            <h3>Active Rooms</h3>
            <div id="room-directory">
                <ul id="room-list"></ul>
            </div>
        </div>

        <!-- Right Panel: Main Content -->
        <div id="right-panel">
            <div class="header-bar">
                <h2>Chat App</h2>
                <div style="display: flex; align-items: center; gap: 15px;">
                    <span id="status" style="color: var(--text-muted); font-size: 14px; font-weight: 600;">Connecting...</span>
                    <button id="theme-toggle" class="icon-btn" title="Toggle Dark Mode">🌙</button>
                </div>
            </div>

            <!-- Setup UI -->
            <div id="setup">
                <div class="setup-card">
                    <h3>Join a Room</h3>
                    <input id="join_username" type="text" placeholder="Your Name">
                    <div class="form-row">
                        <label>Avatar Color:</label>
                        <input type="color" id="join_color" value="#007bff" style="cursor: pointer; width: 40px; height: 30px; padding: 0; border: none; background: transparent;">
                    </div>
                    <input id="join_room" type="text" placeholder="Room Name">
                    <input id="join_password" type="password" placeholder="Password (if private)">
                    <button onclick="joinRoom()">Join Room</button>
                </div>

                <div class="setup-card">
                    <h3>Create a Room</h3>
                    <input id="create_room" type="text" placeholder="New Room Name">
                    <div class="form-row">
                        <label>User Limit (2-50): </label>
                        <input id="create_limit" type="number" min="2" max="50" value="10" style="width: 80px; margin-bottom: 0;">
                    </div>
                    
                    <div class="form-row" style="justify-content: flex-start; gap: 10px;">
                        <input type="checkbox" id="create_is_private" onchange="document.getElementById('create_password').style.display = this.checked ? 'block' : 'none';" style="width: auto;">
                        <label>Make Private</label>
                    </div>
                    <input id="create_password" type="password" placeholder="Set Password" style="display: none; margin-top: 10px;">
                    <button onclick="createRoom()" style="margin-top: 15px;">Create Room</button>
                </div>
            </div>

            <!-- Chat UI -->
            <div id="chat">
                <div class="header-bar" style="border-bottom: none; margin-bottom: 10px; padding-bottom: 0;">
                    <h3 id="room-header"></h3>
                    <button onclick="leaveRoom()" class="danger" style="width: auto; padding: 6px 12px; font-size: 0.9rem;">Leave Room</button>
                </div>

                <div class="chat-container">
                    <div class="chat-main">
                        <div id="messages"></div>
                        <div class="input-area">
                            <div id="typing_indicator"></div>
                            <div class="input-row">
                                <input id="my_message" type="text" placeholder="Type a message..." autocomplete="off" onkeypress="if(event.key === 'Enter') sendMessage()">
                                
                                <div style="position: relative;">
                                    <div class="emoji-btn" id="emoji-toggle">😀</div>
                                    <div id="emoji-picker-container" style="display: none; position: absolute; bottom: 100%; right: 0; margin-bottom: 10px; z-index: 1000; box-shadow: var(--shadow); border-radius: var(--radius);">
                                        <emoji-picker class="dark" style="--background: var(--panel-bg); --border-color: var(--border-color);"></emoji-picker>
                                    </div>
                                </div>

                                <div class="file-upload">
                                    <div class="file-upload-btn">📷</div>
                                    <input type="file" id="image_input" accept="image/*">
                                </div>
                                <button onclick="sendMessage()">Send</button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="roster-sidebar">
                        <h4>Users Online</h4>
                        <ul id="roster"></ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://chat-website-kd6i.onrender.com"; 
        var socket = io(BACKEND_URL, { transports: ['websocket', 'polling'] });
        var username, room;

        // Dark Mode Logic
        const themeBtn = document.getElementById('theme-toggle');
        const picker = document.querySelector('emoji-picker');
        
        function applyTheme(isDark) {
            if (isDark) {
                document.body.classList.add('dark-mode');
                themeBtn.innerText = '☀️';
                picker.classList.add('dark');
            } else {
                document.body.classList.remove('dark-mode');
                themeBtn.innerText = '🌙';
                picker.classList.remove('dark');
            }
        }

        if (localStorage.getItem('theme') === 'dark') {
            applyTheme(true);
        }

        themeBtn.onclick = () => {
            const isDark = !document.body.classList.contains('dark-mode');
            applyTheme(isDark);
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        };

        // Emoji Logic
        const emojiToggle = document.getElementById('emoji-toggle');
        const emojiContainer = document.getElementById('emoji-picker-container');
        const messageInput = document.getElementById('my_message');

        emojiToggle.onclick = (e) => {
            e.stopPropagation();
            emojiContainer.style.display = emojiContainer.style.display === 'none' ? 'block' : 'none';
        };

        document.addEventListener('click', (e) => {
            if (!emojiContainer.contains(e.target) && e.target !== emojiToggle) {
                emojiContainer.style.display = 'none';
            }
        });

        picker.addEventListener('emoji-click', event => {
            messageInput.value += event.detail.unicode;
            messageInput.focus();
        });

        // Socket Logic
        socket.on('connect', function() {
            var s = document.getElementById('status');
            s.innerText = "Connected";
            s.style.color = "#28a745"; // Success green

            if (username && room) {
                var password = document.getElementById('join_password') ? document.getElementById('join_password').value : '';
                socket.emit('join', { username: username, room: room, password: password, color: userColor });
            }
        });

        socket.on('disconnect', function() {
            var s = document.getElementById('status');
            s.innerText = "Reconnecting...";
            s.style.color = "var(--danger)";
        });

        socket.on('join_error', function(data) {
            alert(data.error);
            document.getElementById('chat').style.display = 'none';
            document.getElementById('setup').style.display = 'flex';
            document.getElementById('messages').innerHTML = '';
        });

        socket.on('create_error', function(data) {
            alert(data.error);
        });

        socket.on('create_success', function(data) {
            alert("Room '" + data.room + "' created! You can now join it.");
            document.getElementById('join_room').value = data.room;
            if (document.getElementById('create_is_private').checked) {
                document.getElementById('join_password').value = document.getElementById('create_password').value;
            }
            document.getElementById('create_room').value = '';
            document.getElementById('create_password').value = '';
        });

        function createRoom() {
            var r = document.getElementById('create_room').value;
            var limit = document.getElementById('create_limit').value;
            var isPrivate = document.getElementById('create_is_private').checked;
            var password = document.getElementById('create_password').value;
            if (!r) return alert("Room name is required.");
            socket.emit('create_room', {room: r, limit: limit, is_private: isPrivate, password: password});
        }

        var userColor;
        var notifySound = new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");
        var typingTimeout;

        document.getElementById('my_message').addEventListener('input', function() {
            socket.emit('typing', {is_typing: true});
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(function() {
                socket.emit('typing', {is_typing: false});
            }, 1500);
        });

        socket.on('typing', function(data) {
            var typDiv = document.getElementById('typing_indicator');
            if (data.is_typing) {
                typDiv.innerText = data.user + " is typing...";
            } else {
                typDiv.innerText = "";
            }
        });

        socket.on('room_users', function(users) {
            var roster = document.getElementById('roster');
            if (!roster) return;
            roster.innerHTML = '';
            users.forEach(function(u) {
                var li = document.createElement('li');
                li.innerHTML = `<span class="dot" style="background-color: ${u.color}"></span> <span>${u.name}</span>`;
                roster.appendChild(li);
            });
        });

        function joinRoom() {
            username = document.getElementById('join_username').value.trim();
            room = document.getElementById('join_room').value.trim();
            var password = document.getElementById('join_password').value;
            userColor = document.getElementById('join_color').value;

            if (username && room) {
                socket.emit('join', { username: username, room: room, password: password, color: userColor });
            } else {
                alert("Please enter a name and a room!");
            }
        }

        function leaveRoom() {
            socket.emit('leave', { username: username, room: room });
            document.getElementById('chat').style.display = 'none';
            document.getElementById('setup').style.display = 'flex';
            document.getElementById('messages').innerHTML = '';
            username = null;
            room = null;
        }

        function sendMessage() {
            var msgInput = document.getElementById('my_message');
            var fileInput = document.getElementById('image_input');
            var file = fileInput.files[0];
            var msg = msgInput.value;

            // Handle Image
            if (file) {
                var reader = new FileReader();
                reader.onload = function(evt) {
                    socket.emit('message', {
                        msg: evt.target.result,
                        room: room,
                        username: username,
                        type: 'image'
                    });
                };
                reader.readAsDataURL(file);
                fileInput.value = ''; 
            }

            // Handle Text
            if (msg.trim() !== "") {
                socket.emit('message', { 
                    msg: msg, 
                    room: room, 
                    username: username,
                    type: 'text'
                });
                msgInput.value = '';
                emojiContainer.style.display = 'none';
            }
        }

        function scrollToBottom() {
            var messagesDiv = document.getElementById('messages');
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function appendMessage(data) {
            var messagesDiv = document.getElementById('messages');
            var isOwn = data.user === username;
            var ts = data.timestamp ? data.timestamp.split(' ')[1] : ""; 

            if (typeof data === 'string') {
                var d = document.createElement('div');
                d.className = 'system-msg';
                d.innerText = data;
                messagesDiv.appendChild(d);
            } else {
                var d = document.createElement('div');
                d.className = `msg-container ${isOwn ? 'msg-own' : 'msg-other'}`;
                
                var c = data.color || '#000000';
                if (document.body.classList.contains('dark-mode') && c === '#000000') {
                    c = '#e0e0e0'; // Adjust default black to white in dark mode
                }

                var headerHTML = `<div class="msg-header">
                                    <span class="msg-name" style="color: ${c}">${data.user}</span>
                                    ${ts ? `<span class="msg-time">${ts}</span>` : ''}
                                  </div>`;
                
                var bubbleHTML = '';
                if (data.type === 'image') {
                    // Re-scroll when image fully loads to prevent scrolling issues
                    bubbleHTML = `<div class="msg-bubble"><img src="${data.msg}" class="chat-image" onload="scrollToBottom()"></div>`;
                } else {
                    var urlRegex = /(https?:\/\/[^\s]+)/g;
                    var safeMsg = data.msg.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                    var formattedText = safeMsg.replace(urlRegex, function(url) {
                        return '<a href="' + url + '" target="_blank" style="color: inherit; text-decoration: underline; font-weight: 500;">' + url + '</a>';
                    });
                    bubbleHTML = `<div class="msg-bubble">${formattedText}</div>`;
                }
                
                d.innerHTML = headerHTML + bubbleHTML;
                messagesDiv.appendChild(d);
            }
            scrollToBottom();
        }

        socket.on('message', function (data) {
            appendMessage(data);
            if (data.user && data.user !== username) {
                notifySound.play().catch(function(e) {});
            }
        });

        socket.on('chat_history', function (history) {
            document.getElementById('setup').style.display = 'none';
            document.getElementById('chat').style.display = 'flex';
            document.getElementById('room-header').innerText = room;

            document.getElementById('messages').innerHTML = '';
            history.forEach(function (msgData) {
                appendMessage(msgData);
            });
        });

        socket.on('room_list', function (rooms) {
            var listElement = document.getElementById('room-list');
            if (!listElement) return;

            listElement.innerHTML = '';
            if (rooms.length === 0) {
                listElement.innerHTML = '<li style="padding: 10px; color: var(--text-muted); font-size: 0.9rem;">No active rooms</li>';
            }

            rooms.forEach(function (roomObj) {
                var li = document.createElement('li');
                li.className = 'room-item';
                li.innerHTML = (roomObj.private ? "🔒 " : "💬 ") + roomObj.name;
                li.onclick = function () {
                    document.getElementById('join_room').value = roomObj.name;
                    document.getElementById('join_password').value = '';
                    if (roomObj.private) document.getElementById('join_password').focus();
                };
                listElement.appendChild(li);
            });
        });
    </script>
</body>
</html>
