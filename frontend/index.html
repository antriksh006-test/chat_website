<!DOCTYPE html>
<html>

<head>
    <title>Simple Chat Rooms</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            gap: 20px;
            padding: 20px;
        }

        #left-panel {
            flex: 1;
            border-right: 1px solid #ddd;
            padding-right: 20px;
            max-width: 250px;
        }

        #right-panel {
            flex: 3;
        }

        #messages {
            border: 1px solid #ccc;
            height: 300px;
            overflow-y: scroll;
            padding: 10px;
            margin-bottom: 10px;
            background: #fafafa;
        }

        .room-item {
            cursor: pointer;
            color: blue;
            text-decoration: underline;
            margin-bottom: 5px;
        }

        .room-item:hover {
            color: darkblue;
        }

        /* Styling for the shared images */
        .chat-image {
            max-width: 250px;
            max-height: 250px;
            display: block;
            border-radius: 8px;
            margin-top: 5px;
            border: 1px solid #ddd;
        }

        .system-msg {
            color: gray;
            font-style: italic;
        }
        @media (max-width: 600px) {
            body {
                flex-direction: column;
            }
            #left-panel {
                max-width: none;
                border-right: none;
                border-bottom: 1px solid #ddd;
                padding-right: 0;
                padding-bottom: 20px;
                margin-bottom: 20px;
            }
            #messages {
                height: 250px;
            }
            div[style*="gap: 10px"] {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>

<body>

    <div id="left-panel">
        <h3>Active Rooms</h3>
        <div id="room-directory" style="padding: 10px; background: #f0f0f0; border-radius: 5px;">
            <ul id="room-list" style="list-style: none; padding: 0;"></ul>
        </div>
    </div>

    <div id="right-panel">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>Chat App</h2>
            <span id="status" style="color: red; font-size: 14px; font-weight: bold;">Connecting...</span>
        </div>

        <div id="setup" style="display: flex; gap: 20px; flex-wrap: wrap;">
            <div style="flex: 1; border: 1px solid #ccc; padding: 15px; border-radius: 5px; min-width: 200px;">
                <h3>Join a Room</h3>
                <input id="join_username" placeholder="Your Name" style="margin-bottom: 5px; width: 100%;"><br>
                <div style="margin-bottom: 5px; display: flex; align-items: center; justify-content: space-between;">
                    <label style="font-size: 14px;">Name Color:</label>
                    <input type="color" id="join_color" value="#000000" style="cursor: pointer;">
                </div>
                <input id="join_room" placeholder="Room Name" style="margin-bottom: 5px; width: 100%;"><br>
                <input id="join_password" type="password" placeholder="Password (if private)" style="margin-bottom: 15px; width: 100%;"><br>
                <button onclick="joinRoom()">Join Room</button>
            </div>

            <div style="flex: 1; border: 1px solid #ccc; padding: 15px; border-radius: 5px; min-width: 200px;">
                <h3>Create a Room</h3>
                <input id="create_room" placeholder="New Room Name" style="margin-bottom: 5px; width: 100%;"><br>
                <label style="font-size: 14px;">User Limit (2-50): </label>
                <input id="create_limit" type="number" min="2" max="50" value="10" style="margin-bottom: 5px; width: 60px;"><br>
                
                <label style="font-size: 14px; margin-top: 5px; display: block;">
                    <input type="checkbox" id="create_is_private" onchange="document.getElementById('create_password').style.display = this.checked ? 'block' : 'none';"> Make Private
                </label>
                <input id="create_password" type="password" placeholder="Set Password" style="margin-bottom: 15px; width: 100%; display: none; margin-top: 5px;">
                <button onclick="createRoom()" style="margin-top: 5px;">Create Room</button>
            </div>
        </div>

        <div id="chat" style="display:none;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 id="room-header"></h3>
                <button onclick="leaveRoom()"
                    style="background: red; color: white; border: none; padding: 5px 10px; cursor: pointer;">Leave Room</button>
            </div>

            <div id="messages"></div>

            <div style="display: flex; gap: 10px; align-items: center;">
                <input id="my_message" placeholder="Type message..." style="flex: 2; padding: 5px;">
                <input type="file" id="image_input" accept="image/*" style="flex: 1;">
                <button onclick="sendMessage()" style="padding: 5px 15px;">Send</button>
            </div>
        </div>
    </div>

    <script>
        // Update BACKEND_URL to your Render backend URL once deployed. For local testing, use http://localhost:5000
        const BACKEND_URL = "https://chat-website-kd6i.onrender.com"; 
        var socket = io(BACKEND_URL, { transports: ['websocket', 'polling'] });
        var username, room;

        socket.on('connect', function() {
            document.getElementById('status').innerText = "Connected";
            document.getElementById('status').style.color = "green";
        });

        socket.on('disconnect', function() {
            document.getElementById('status').innerText = "Disconnected";
            document.getElementById('status').style.color = "red";
            leaveRoom();
        });

        socket.on('join_error', function(data) {
            alert(data.error);
            document.getElementById('chat').style.display = 'none';
            document.getElementById('setup').style.display = 'flex';
            document.getElementById('messages').innerHTML = '';
        });

        socket.on('create_error', function(data) {
            alert(data.error);
        });

        socket.on('create_success', function(data) {
            alert("Room '" + data.room + "' was created! You can now join it using the Join panel.");
            document.getElementById('join_room').value = data.room;
            if (document.getElementById('create_is_private').checked) {
                document.getElementById('join_password').value = document.getElementById('create_password').value;
            }
            document.getElementById('create_room').value = '';
            document.getElementById('create_password').value = '';
        });

        function createRoom() {
            var r = document.getElementById('create_room').value;
            var limit = document.getElementById('create_limit').value;
            var isPrivate = document.getElementById('create_is_private').checked;
            var password = document.getElementById('create_password').value;
            if (!r) return alert("Room name is required.");
            socket.emit('create_room', {room: r, limit: limit, is_private: isPrivate, password: password});
        }

        var userColor;

        // JOIN ROOM
        function joinRoom() {
            username = document.getElementById('join_username').value;
            room = document.getElementById('join_room').value;
            var password = document.getElementById('join_password').value;
            userColor = document.getElementById('join_color').value;

            if (username && room) {
                socket.emit('join', { username: username, room: room, password: password, color: userColor });
            } else {
                alert("Please enter a name and a room!");
            }
        }

        // LEAVE ROOM
        function leaveRoom() {
            socket.emit('leave', { username: username, room: room });
            document.getElementById('chat').style.display = 'none';
            document.getElementById('setup').style.display = 'flex';
            document.getElementById('messages').innerHTML = '';
        }

        // SEND MESSAGE (Handles Text and/or Images)
        function sendMessage() {
            var msgInput = document.getElementById('my_message');
            var fileInput = document.getElementById('image_input');
            var file = fileInput.files[0];
            var msg = msgInput.value;

            // 1. Handle Image Upload
            if (file) {
                var reader = new FileReader();
                reader.onload = function(evt) {
                    socket.emit('message', {
                        msg: evt.target.result,
                        room: room,
                        username: username,
                        type: 'image'
                    });
                };
                reader.readAsDataURL(file);
                fileInput.value = ''; // Reset file input
            }

            // 2. Handle Text Message
            if (msg.trim() !== "") {
                socket.emit('message', { 
                    msg: msg, 
                    room: room, 
                    username: username,
                    type: 'text'
                });
                msgInput.value = ''; // Reset text input
            }
        }

        // Helper function to render a message
        function appendMessage(data) {
            var p = document.createElement('p');
            var messagesDiv = document.getElementById('messages');
            var c = data.color || '#000000';

            if (typeof data === 'string') {
                p.innerHTML = `<span class="system-msg">${data}</span>`;
            } else {
                if (data.type === 'image') {
                    p.innerHTML = `<b style="color: ${c}">${data.user}:</b><br><img src="${data.msg}" class="chat-image">`;
                } else {
                    p.innerHTML = `<b style="color: ${c}">${data.user}:</b> ${data.msg}`;
                }
            }

            messagesDiv.appendChild(p);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // RECEIVE LIVE MESSAGE
        socket.on('message', function (data) {
            appendMessage(data);
        });

        // RECEIVE CHAT HISTORY ON JOIN
        socket.on('chat_history', function (history) {
            // Un-hide chat UI once history loads (proof of successful join)
            document.getElementById('setup').style.display = 'none';
            document.getElementById('chat').style.display = 'block';
            document.getElementById('room-header').innerText = "Room: " + room;

            document.getElementById('messages').innerHTML = '';
            history.forEach(function (msgData) {
                appendMessage(msgData);
            });
        });

        // UPDATE ROOM LIST
        socket.on('room_list', function (rooms) {
            console.log("Rooms received:", rooms);
            var listElement = document.getElementById('room-list');
            if (!listElement) return;

            listElement.innerHTML = '';
            if (rooms.length === 0) {
                listElement.innerHTML = '<li>No active rooms</li>';
            }

            rooms.forEach(function (roomObj) {
                var li = document.createElement('li');
                li.className = 'room-item';
                li.innerText = roomObj.private ? "🔒 " + roomObj.name : roomObj.name;
                li.onclick = function () {
                    document.getElementById('join_room').value = roomObj.name;
                    document.getElementById('join_password').value = '';
                    if (roomObj.private) document.getElementById('join_password').focus();
                };
                listElement.appendChild(li);
            });
        });
    </script>
</body>
</html>
